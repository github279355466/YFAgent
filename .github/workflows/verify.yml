name: verify

# 触发时机：PR 与 main推送
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: windows-latest   # 与本地开发环境一致（行尾策略：CRLF）

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 项目当前零运行时依赖，抽取脚本仅用 Node 内置模块。
      # 保留 npm ci 以便后续 packages 引入依赖时无需改动流程。
      - name: 安装依赖
        run: npm ci

      # ── 门禁 1：敏感信息扫描（最高优先级）──
      - name: 敏感信息扫描
        run: npm run scan:secrets

      # ── 门禁 2：知识产物一致性 ──
      # 校验三类产物（typekey / 字段对照表 / 域归属草案）的内容指纹，
      # 检出「产物过期 / 被篡改 / 缺失」三类问题。
      # 注意：CI 环境缺少源文件 docs/易飞OpenAPI.json（50,401,916 字节 ≈ 48 MiB，不入库），
      #      故跳过 check:all，仅在 PR 中人工确认产物与脚本变更同步。
      - name: 校验知识产物
        run: |
          if (Test-Path "docs/易飞OpenAPI.json") {
            npm run check:all
          } else {
            Write-Host "::notice::源文件 docs/易飞OpenAPI.json 不在仓库（设计如此），跳过产物指纹校验"
            Write-Host "::notice::请人工确认 PR 中的 knowledge/ 产物与 scripts/ 变更同步"
          }

      # ── 门禁 3：数据字典冻结口径 ──
      # 字典口径数字（26798 / 26087 / 711 / 6）此前改了 5 轮，根因是判据不统一。
      # 本门禁只读 knowledge/data-dictionary/_gen-stats.json（已入库）并断言冻结计数，
      # **不重新生成产物**，因此不受上一步「源文件缺失」的影响，可无条件执行。
      # 口径若被改动，此处直接 FAIL，而不是静默产出错误数字。
      #
      # 关于与门禁 2 的重复：check:dictionary 确实是 check:all 的子集，此处看似冗余，
      # 但**必须保留、不可删除**。原因是两者覆盖面不同——
      #   门禁 2（check:all）：需要 50,401,916 字节源文件，CI 中恒被 if 跳过；
      #   门禁 3（本步）  ：只依赖已入库的 _gen-stats.json，CI 中恒执行。
      # 因此门禁 3 是 CI 上唯一真正生效的口径校验，是门禁 2 被跳过后的兜底；
      # 若删掉它，CI 将完全失去冻结口径校验（本地通过 ≠ CI 通过）。
      # 二者关系是「覆盖广但常跳过」与「覆盖窄但必执行」的互补，不是重复劳动。
      - name: 校验数据字典冻结口径
        run: npm run check:dictionary

      # ── 行尾与编码一致性 ──
      - name: 校验行尾与编码
        shell: bash
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            if file "$f" | grep -q 'CRLF'; then continue; fi
            if echo "$f" | grep -qE '\.(png|jpg|zip|pdf|xlsx)$'; then continue; fi
            echo "::error file=$f::非 CRLF 行尾"
            fail=1
          done < <(find . -type f -not -path './.git/*' -not -path './node_modules/*' -print0)
          exit $fail
